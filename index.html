<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajmo-Ajde</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&display=swap');

        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ffb6c1, #ff69b4);
            font-family: 'Dancing Script', cursive;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            max-width: 85%;
            padding: 40px 20px;
        }
        
        h1 { 
            color: white; 
            font-size: 3.2rem; 
            margin-bottom: 20px; 
            text-shadow: 0 3px 10px rgba(0,0,0,0.25); 
        }
        
        #tekst { 
            color: white; 
            font-size: 2.05rem; 
            line-height: 1.5; 
            text-shadow: 0 2px 8px rgba(0,0,0,0.2); 
            min-height: 200px;
        }
        
        .srce { 
            font-size: 4.5rem; 
            margin: 25px 0; 
            animation: pulsiraj 2s infinite; 
        }
        
        .cursor {
            display: inline-block;
            width: 3px;
            height: 2.05rem;
            background-color: white;
            margin-left: 5px;
            animation: blink 1s infinite;
            vertical-align: middle;
        }
        
        /* Stil za dugme i njegovu poziciju - potrebno za relativno pozicioniranje nota */
        .muzika-dugme-wrapper {
            position: relative;
            display: inline-block;
        }
        
        .muzika-dugme {
            margin-top: 35px;
            padding: 14px 32px;
            font-size: 1.5rem;
            font-family: 'Dancing Script', cursive;
            font-weight: 600;
            background: white;
            color: #d63384;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.25);
            transition: all 0.3s;
            position: relative;
            z-index: 2;
        }
        
        .muzika-dugme:hover {
            transform: scale(1.08);
            background: #ffe4f0;
        }
        
        /* Stil za note koje izlaze iz dugmeta */
        .note {
            position: absolute;
            font-size: 1.8rem;
            pointer-events: none;
            z-index: 10;
            animation: floatUp 2s ease-out forwards;
        }
        
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-120px) rotate(20deg);
            }
        }
        
        /* Animacija za pulsiranje dugmeta dok ne klikne */
        .muzika-dugme.pulse {
            animation: pulseGlow 1.5s ease-in-out infinite;
        }
        
        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7);
                transform: scale(1);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(255, 255, 255, 0);
                transform: scale(1.05);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
                transform: scale(1);
            }
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        @keyframes pulsiraj {
            0% { transform: scale(1); }
            50% { transform: scale(1.18); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ajmo...</h1>
        <div class="srce">💗</div>
        <p id="tekst"></p>
        
        <!-- Dugme sa wrapperom za note -->
        <div class="muzika-dugme-wrapper">
            <button class="muzika-dugme pulse" id="musicBtn">
                🧳 Ajde 🚗
            </button>
        </div>
    </div>

    <!-- Audio player -->
    <audio id="audio" loop>
        <source src="javolim.mp3" type="audio/mpeg">
    </audio>

    <script>
        // TEKST KOJI CE SE ISPISIVATI NAKON KLIKA
        const poruka = `Ajmo do Beča sredinom Oktobra. Biće tamo i ... tih dana. Ponesi osmeh. Za sve ostalo ćemo lako.`;
        
        const karakteri = poruka.split("");
        const tekstElement = document.getElementById("tekst");
        let index = 0;
        let pauzaIzmedjuKaraktera = 180;
        let pauzaNaKraju = 7000;
        let treperi = null;
        let tekstZapocet = false; // Da li je tekst već počeo da se ispisuje
        
        // Varijable za note
        let noteInterval = null;
        let musicStarted = false;
        const btn = document.getElementById("musicBtn");

        // Funkcija za kreiranje note
        function createNote() {
            const wrapper = document.querySelector('.muzika-dugme-wrapper');
            const button = document.querySelector('.muzika-dugme');
            
            // Dobijamo poziciju dugmeta
            const btnRect = button.getBoundingClientRect();
            const wrapperRect = wrapper.getBoundingClientRect();
            
            // Kreiranje note elementa
            const note = document.createElement('div');
            note.className = 'note';
            
            // Random odabir muzičkog simbola
            const notes = ['🎵', '🎶', '♪', '♫', '🎤', '🎸'];
            const randomNote = notes[Math.floor(Math.random() * notes.length)];
            note.textContent = randomNote;
            
            // Random horizontalna pozicija (lijevo-desno od centra dugmeta)
            const randomX = (Math.random() - 0.5) * 60;
            note.style.left = `calc(50% + ${randomX}px)`;
            note.style.bottom = '0px';
            
            // Random veličina
            const randomSize = 1.2 + Math.random() * 1;
            note.style.fontSize = `${randomSize}rem`;
            
            // Random rotacija
            const randomRotate = (Math.random() - 0.5) * 30;
            note.style.setProperty('--rotate', `${randomRotate}deg`);
            
            wrapper.appendChild(note);
            
            // Ukloni notu nakon animacije
            setTimeout(() => {
                note.remove();
            }, 2000);
        }
        
        // Pokretanje animacije nota
        function startNoteAnimation() {
            if (noteInterval) clearInterval(noteInterval);
            noteInterval = setInterval(createNote, 400); // Nova nota svakih 0.4 sekunde
        }
        
        // Zaustavljanje animacije nota
        function stopNoteAnimation() {
            if (noteInterval) {
                clearInterval(noteInterval);
                noteInterval = null;
            }
        }
        
        // Funkcije za kursor
        function dodajKursor() {
            if (treperi) treperi.remove();
            treperi = document.createElement("span");
            treperi.className = "cursor";
            tekstElement.appendChild(treperi);
        }

        function ukloniKursor() {
            if (treperi) {
                treperi.remove();
                treperi = null;
            }
        }

        function ocistiTekst() {
            tekstElement.textContent = "";
            ukloniKursor();
        }

        function prikaziSlovoPoSlovo() {
            if (index < karakteri.length) {
                tekstElement.textContent += karakteri[index];
                index++;
                ukloniKursor();
                dodajKursor();
                setTimeout(prikaziSlovoPoSlovo, pauzaIzmedjuKaraktera);
            } else {
                ukloniKursor();
                setTimeout(() => {
                    ocistiTekst();
                    index = 0;
                    tekstZapocet = false; // Resetuj stanje - čekamo novi klik
                    dodajKursor();
                    // Ne pokreći automatski ponovo, čekamo novi klik
                }, pauzaNaKraju);
            }
        }
        
        // Funkcija koja pokreće sve - MUZIKU I TEKST
        function pokreniSve() {
            if (musicStarted) return; // Spriječi višestruko pokretanje
            
            musicStarted = true;
            
            // Pokreni muziku
            audio.currentTime = 0;
            audio.play();
            
            // Zaustavi animaciju nota
            stopNoteAnimation();
            
            // Ukloni pulse klasu sa dugmeta
            btn.classList.remove('pulse');
            
            // Dodaj mali efekat na dugme nakon klika
            btn.style.transform = 'scale(0.95)';
            setTimeout(() => {
                btn.style.transform = '';
            }, 200);
            
            // Pokreni ispisivanje teksta (samo ako nije već počelo)
            if (!tekstZapocet) {
                tekstZapocet = true;
                index = 0;
                ocistiTekst();
                dodajKursor();
                prikaziSlovoPoSlovo();
            }
        }

        // === POSTAVI DOGADJAJ ZA KLIK NA DUGME ===
        btn.addEventListener("click", pokreniSve);

        // Pokretanje animacije nota odmah pri učitavanju
        window.addEventListener('load', () => {
            // Dodaj kursor ali ga sakrij dok ne počne tekst
            dodajKursor();
            ukloniKursor(); // Sakrij kursor dok ne klikne
            
            // Pokreni animaciju nota nakon 1 sekunde
            setTimeout(() => {
                startNoteAnimation();
            }, 1000);
        });
    </script>
</body>
</html>
